name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR에 새 커밋이 올라오면 이전 실행은 취소한다.
# main은 취소하지 않는다(버킷에 올리던 배포가 중간에 끊기면 안 된다).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # 배포가 지난 화면 파일을 고르는 스크립트(.github/scripts)의 테스트. 운영 파일을 지우는 코드라 PR에서 확인한다.
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: npm run build

      # 배포 잡이 올린다. 검사를 지난 바로 그 빌드다.
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # 운영 프론트: CloudFront + S3(비공개 버킷). API는 같은 주소의 /api/*다.
  deploy:
    needs: check
    # 환경 aws-production도 main만 허용한다(둘 중 하나가 풀려도 다른 쪽이 막는다).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-production
    # 배포는 하나씩. 앞의 배포를 취소하지 않는다.
    concurrency:
      group: deploy-aws-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      BUCKET: ${{ vars.WEB_BUCKET }}
      SITE_URL: https://www.jeymanagement.com
    steps:
      # 이 잡은 OIDC 토큰을 받는다. 어느 단계든 토큰을 요청할 수 있으므로 모든 액션을 태그 대신 커밋으로 고정한다(태그는 옮길 수 있다).
      # 지난 화면 파일을 고르는 스크립트만 받는다(.github/scripts). 빌드 결과물보다 먼저 받는다(checkout이 폴더를 비운다).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 새 파일을 먼저 올리고, index.html을 바꾼 뒤, 지난 빌드의 파일을 지운다.
      # 순서가 바뀌면 새 index.html이 아직 없는 파일을 가리키는 순간이 생긴다.
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html과 파비콘은 이름에 해시가 없다. 새 배포가 바로 보이게 캐시하지 않는다.
      - name: Upload index.html
        run: |
          aws s3 cp dist "s3://$BUCKET" --recursive --exclude "assets/*" \
            --cache-control "no-cache"

      # 해시가 없는 파일(index.html 밖의 지난 파일)은 바로 지운다. 화면 파일과 배포 기록은 아래에서 따로 다룬다.
      - name: Delete old files
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --exclude "deploys/*" \
            --cache-control "no-cache"

      # 지난 빌드의 화면 파일은 그 빌드가 밀려난 때부터 7일 동안 남긴다. 배포 전에 연 탭이 아직 받지 않은 화면으로 가도
      # 옛 파일을 받을 수 있다(#154). 밀려난 때를 알려고 배포마다 그 빌드의 파일 목록을 deploys/<시각>.json에 남긴다.
      # 이번 배포의 기록을 먼저 남기고 고른다. 고르기·지우기가 실패해도 이번 빌드의 기록은 남는다.
      # shell: bash는 pipefail을 켠다. 목록을 받지 못하면 단계가 실패한다(조용히 "지울 것 0개"로 끝나지 않는다).
      - name: Delete stale assets
        shell: bash
        run: |
          python3 .github/scripts/stale_assets.py record --current dist/assets > record.json
          aws s3 cp record.json "s3://$BUCKET/deploys/$(date -u +%Y%m%dT%H%M%SZ).json" \
            --content-type application/json --cache-control "no-cache"
          aws s3 cp "s3://$BUCKET/deploys/" manifests/ --recursive --exclude "*" --include "*.json"
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix assets/ --output json > listing.json
          python3 .github/scripts/stale_assets.py select --current dist/assets \
            --manifests manifests --listing listing.json --days 7 > stale.txt
          echo "stale files: $(wc -l < stale.txt)"
          while read -r key; do
            aws s3 rm "s3://$BUCKET/$key"
          done < stale.txt

      # 프론트 경로는 CloudFront Function이 모두 /index.html로 바꾸므로 이것 하나만 무효화한다.
      - name: Invalidate index.html
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" \
            --paths /index.html --query Invalidation.Id --output text

      # 역할에 무효화 상태를 읽는 권한은 없다. 대신 실제 주소가 새 index.html을 줄 때까지 본다.
      - name: Check live site
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$SITE_URL/" | cmp -s - dist/index.html; then
              echo "live: $SITE_URL serves this build"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE_URL still serves another index.html after 5 minutes"
          exit 1
