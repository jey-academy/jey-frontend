name: Sync API types

# 백엔드 main의 명세(docs/api/openapi.json)로 타입을 다시 만들어, 커밋된 schema.d.ts와 다르면 갱신 PR을 연다.
# 평소에는 기능 브랜치에서 `npm run api:gen`으로 타입을 직접 가져온다. 이 워크플로는 그걸 잊었을 때의 안전망이다.

on:
  schedule:
    # 매일 06:17 KST (cron은 UTC 기준). 공개 저장소에 60일 동안 활동이 없으면 GitHub이 주기 실행을 끈다.
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [test/sync-api-types-trial]

concurrency:
  group: sync-api-types
  cancel-in-progress: false

# 권한은 작업마다 따로 준다.
permissions: {}

env:
  SCHEMA: src/shared/api/schema.d.ts
  # 주기 실행에서는 main이다. 수동 실행에서는 실행한 브랜치가 PR의 대상이 된다.
  BASE_BRANCH: ${{ github.ref_name }}
  # 갱신 브랜치는 대상 브랜치마다 따로 둔다. 다른 브랜치에서 수동 실행해도 main의 갱신 PR을 건드리지 않는다.
  SYNC_BRANCH: >-
    ${{ (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    && 'chore/sync-api-types' || format('chore/sync-api-types-{0}', github.ref_name) }}

jobs:
  # 의존성 설치, 타입 생성, 타입 검사, 테스트처럼 저장소와 패키지의 코드를 실행하는 일은 읽기 권한만으로 한다.
  generate:
    # 태그에서는 실행하지 않는다. PR의 대상이 될 수 없다.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      stale: ${{ steps.plan.outputs.stale }}
      changed: ${{ steps.branch.outputs.changed }}
      typecheck: ${{ steps.typecheck.outcome }}
      test: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run api:gen:remote

      - name: 커밋된 타입과 비교
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 포크에서 같은 이름의 브랜치로 연 PR은 갱신 PR로 보지 않는다.
          pr=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # 추적되지 않는 파일은 git diff가 항상 "같다"고 답한다. 경로가 어긋났으면 여기서 멈춘다.
          if ! git ls-files --error-unmatch -- "$SCHEMA" > /dev/null; then
            echo "::error::$SCHEMA 가 저장소에 없다. 타입 파일의 경로를 확인한다."
            exit 1
          fi
          if git diff --quiet -- "$SCHEMA"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "타입이 명세와 같다."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "타입이 명세와 다르다."
          fi

      - name: 열린 갱신 PR이 있으면 그 브랜치에서 다시 생성
        id: branch
        if: steps.plan.outputs.stale == 'true'
        env:
          PR: ${{ steps.plan.outputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            # 열린 PR에는 사람이 올린 수정 커밋이 있을 수 있다. 검사도 그 브랜치의 코드로 한다.
            git checkout -- "$SCHEMA"
            git fetch --depth=1 origin "$SYNC_BRANCH"
            git checkout --detach FETCH_HEAD
            npm ci
            npm run api:gen:remote
          fi
          if git diff --quiet -- "$SCHEMA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "열린 PR이 이미 최신 명세를 담고 있다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 기본 토큰으로 연 PR의 CI는 승인해야 돈다. 그래서 타입 검사와 테스트만 여기서 먼저 돌리고 결과를 PR 본문에 적는다.
      # 실패해도 PR은 연다. 깨진 곳을 그 PR에서 고치는 것이 목적이다.
      - name: 타입 검사
        id: typecheck
        if: steps.branch.outputs.changed == 'true'
        continue-on-error: true
        run: npm run typecheck

      - name: 테스트
        id: test
        if: steps.branch.outputs.changed == 'true'
        continue-on-error: true
        run: npm run test

      - uses: actions/upload-artifact@v4
        if: steps.branch.outputs.changed == 'true'
        with:
          name: api-schema
          path: ${{ env.SCHEMA }}
          retention-days: 1

  # 쓰기 권한은 이 작업에만 준다. 저장소나 패키지의 코드를 실행하지 않고 git과 gh만 쓴다.
  publish:
    needs: generate
    if: >-
      needs.generate.outputs.changed == 'true' ||
      (needs.generate.outputs.stale == 'false' && needs.generate.outputs.pr != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # 앞 작업이 넘긴 PR 번호를 믿지 않고 여기서 다시 찾는다. 닫거나 고칠 대상은 이 작업이 직접 정한다.
      - name: 갱신 PR 찾기
        id: pr
        run: |
          pr=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      # 대상 브랜치의 타입이 이미 명세와 같아진 경우다 (다른 PR로 타입이 들어왔거나 명세가 되돌려졌다).
      # 갱신 PR은 할 일이 없으므로 닫는다. 사람이 올린 수정 커밋이 있을 수 있어 브랜치는 지우지 않는다.
      - name: 필요 없어진 갱신 PR 닫기
        if: needs.generate.outputs.changed != 'true' && steps.pr.outputs.pr != ''
        env:
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          gh pr close "$PR" \
            --comment "\`$BASE_BRANCH\`의 타입이 이미 백엔드 명세와 같아서 닫습니다. 브랜치 \`$SYNC_BRANCH\`는 남겨 둡니다. 다음 갱신 PR을 열 때 덮어씁니다."

      - uses: actions/checkout@v4
        if: needs.generate.outputs.changed == 'true'
        with:
          ref: ${{ steps.pr.outputs.pr != '' && env.SYNC_BRANCH || github.ref }}

      - uses: actions/download-artifact@v4
        if: needs.generate.outputs.changed == 'true'
        with:
          name: api-schema
          path: ${{ runner.temp }}/api-schema

      # PR 생성이 권한 오류로 실패하면 저장소 설정을 확인한다:
      # Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
      - name: 커밋하고 PR 열기 또는 갱신
        if: needs.generate.outputs.changed == 'true'
        env:
          PR: ${{ steps.pr.outputs.pr }}
          TYPECHECK: ${{ needs.generate.outputs.typecheck }}
          TEST: ${{ needs.generate.outputs.test }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          # 받은 것 중 타입 파일 하나만 저장소에 넣는다.
          # 경로에 심볼릭 링크가 끼어 있으면 .git 안이나 저장소 밖에 쓰게 될 수 있으므로 멈춘다.
          src="$RUNNER_TEMP/api-schema/$(basename "$SCHEMA")"
          path="$SCHEMA"
          while [ "$path" != "." ]; do
            if [ -L "$path" ]; then
              echo "::error::심볼릭 링크라서 쓰지 않는다: $path"
              exit 1
            fi
            path=$(dirname "$path")
          done
          if [ -L "$src" ] || [ ! -f "$src" ]; then
            echo "::error::받은 타입 파일이 없다."
            exit 1
          fi
          cp "$src" "$SCHEMA"
          git add "$SCHEMA"
          if git diff --cached --quiet; then
            echo "커밋할 변경이 없다."
            exit 0
          fi
          git commit -m "chore(api): 백엔드 명세에 맞춰 API 타입 갱신"
          if [ -n "$PR" ]; then
            git push origin "$SYNC_BRANCH"
          else
            # 열린 PR이 없으면 예전 갱신 브랜치가 남아 있어도 덮어쓴다.
            git push --force origin "$SYNC_BRANCH"
          fi

          result() { if [ "$1" = "success" ]; then echo "✅ 통과"; else echo "❌ 실패"; fi; }
          spec_commit=$(gh api "repos/jey-academy/jey-backend/commits?path=docs/api/openapi.json&sha=main&per_page=1" \
            --jq '.[0] | "[\(.sha[0:7])](\(.html_url)) `\(.commit.message | split("\n")[0])`"' ||
            { echo "::warning::명세의 마지막 커밋을 조회하지 못했다." >&2; echo "확인하지 못함"; })

          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## 변경 사항
          - 백엔드 \`main\`의 명세(\`docs/api/openapi.json\`)에 맞춰 \`$SCHEMA\`를 다시 만들었습니다.
          - 명세의 마지막 변경: $spec_commit

          ## 검사 결과
          | 검사 | 결과 |
          |---|---|
          | 타입 검사 (\`npm run typecheck\`) | $(result "$TYPECHECK") |
          | 테스트 (\`npm run test\`) | $(result "$TEST") |

          - 실행 기록: $RUN_URL
          - 실패한 검사는 이 브랜치(\`$SYNC_BRANCH\`)에 수정 커밋을 올려 고칩니다.

          ## 기타 공유 사항
          - 이 PR은 워크플로가 열어서 CI가 승인 대기 상태로 멈춥니다. PR 화면의 "Approve workflows to run"을 누르거나 수정 커밋을 올리면 CI가 돕니다.
          - 위 검사 결과는 워크플로가 마지막으로 타입을 갱신한 시점의 것이고, CI 전체(lint, format, build)를 대신하지 않습니다.
          EOF

          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" \
              --title "[Chore] API 타입 갱신 (백엔드 명세 변경)" \
              --label chore \
              --body-file "$RUNNER_TEMP/body.md"
          fi
